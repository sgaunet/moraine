# GoReleaser Configuration Template
# Replace PROJECT_NAME, REGISTRY_URL, and OWNER with your actual values
# Docs: https://goreleaser.com

version: 2

# Project name used in releases, archives, and Docker images
# CUSTOMIZE: Replace with your project name (lowercase, no spaces)
project_name: "moraine"

# Hooks to run before building
before:
  hooks:
    # Download dependencies
    - go mod download
    # Run code generation if using go:generate
    - go generate ./...

# Build configuration
builds:
  - # Disable CGO for static binaries (recommended)
    env:
      - CGO_ENABLED=0

    # CUSTOMIZE: Directory containing main.go
    # Use "." if main.go is in root, "cmd" if in cmd/, etc.
    dir: .

    # Inject version information at build time
    # CUSTOMIZE: Adjust variable name if your main package uses different variable
    ldflags:
      - -X main.version={{.Version}}
      # Optional: Add more build info
      # - -X main.commit={{.Commit}}
      # - -X main.date={{.Date}}
      # - -s -w  # Strip debug info for smaller binaries

    # Target operating systems
    # Options: linux, darwin (macOS), windows, freebsd, openbsd, netbsd
    goos:
      - linux
      - darwin
      # - windows  # Uncomment if Windows support needed

    # Target architectures
    # Options: amd64, arm64, arm, 386, ppc64le, s390x
    # NOTE: 32-bit arm (armv6/v7) is intentionally excluded — the imagemeta
    # dependency overflows int on 32-bit and has no fixed release.
    goarch:
      - amd64   # x86_64: Most servers, desktops
      - arm64   # ARM 64-bit: Apple Silicon, AWS Graviton, modern ARM

    # Optional: Ignore specific combinations
    # ignore:
    #   - goos: darwin
    #     goarch: arm
    #   - goos: windows
    #     goarch: arm64

# Archive configuration
archives:
  - # Archive naming: PROJECT_NAME_v1.0.0_linux_amd64
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'

    # tar.gz, NOT "binary". The Homebrew cask generates shell completions by
    # running the staged executable, and GoReleaser can only name it as the plain
    # binary ("moraine"): generate_completions_from_executable.executable defaults
    # to binaries[0] and is not templated, so it can never match the versioned
    # filename a "binary" archive stages. Homebrew then falls back to a bare PATH
    # lookup and `brew` resets PATH to /usr/bin:/bin:/usr/sbin:/sbin during
    # install, so every shell fails with exit 127 -- and only warns. A tar.gz
    # stages ./moraine at a fixed path, and carries LICENSE/README too.
    formats: ["tar.gz"]

# Generate checksums file for verification
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256  # Options: sha256, sha512, sha1, md5

# Changelog configuration
changelog:
  sort: asc  # Ascending order (oldest to newest)
  filters:
    exclude:
      # Exclude commits that don't affect users
      - '^docs:'        # Documentation updates
      - '^test:'        # Test-only changes
      - '^ci:'          # CI configuration
      - '^chore:'       # Maintenance tasks
      # - '^style:'     # Code style changes
      # - '^refactor:'  # Refactoring

# Homebrew cask publishing (replaces the deprecated `brews:` block, which
# GoReleaser removes in the v2.16 line; only casks can install completions)
homebrew_casks:
  - name: moraine
    homepage: 'https://github.com/sgaunet/moraine'
    description: 'Organize photos into event folders by capture time and theme'
    # NOTE: no `license:` here -- Homebrew's cask DSL has no license stanza, so
    # GoReleaser never emits it. MIT is declared in LICENSE and go.mod's repo.

    # Tap repository directory (casks live in Casks/, not Formula/)
    directory: Casks

    # Command name users invoke, mapped from the versioned artifact name.
    binaries:
      - moraine

    # exiftool is required at runtime to read RAW previews.
    dependencies:
      - formula: exiftool

    # Runs `moraine completion <shell>` at install time and writes the scripts to
    # Homebrew's bash/zsh/fish/pwsh completion directories. `cobra` is a
    # first-class shell_parameter_format in Homebrew and implies all four shells.
    generate_completions_from_executable:
      shell_parameter_format: cobra

    # Strip the quarantine xattr BEFORE artifacts install, so the completion
    # generator can actually execute the staged binary (post-install is too late).
    hooks:
      pre:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", staged_path]
          end

    commit_author:
      name: Sylvain
      email: 1552102+sgaunet@users.noreply.github.com

    repository:
      owner: sgaunet
      name: homebrew-tools
      # Personal Access Token with 'repo' scope; set HOMEBREW_TAP_TOKEN in CI.
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'

# Optional: Snapcraft (Linux Snap packages)
