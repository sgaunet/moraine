version: "2"

# Strategy: enable everything, then disable the opinionated, style-only, or
# domain-inappropriate linters. The high-value correctness linters (govet,
# staticcheck, unused, ineffassign, errorlint, revive, ...) stay on. Tune the
# disable list to taste.
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - err113
    - errcheck
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gocognit
    - gocritic
    - gocyclo
    - goconst
    - gosec
    - ireturn
    - lll
    - mnd
    - modernize
    - musttag
    - nestif
    - nilerr
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
    - gomodguard
  settings:
    tagliatelle:
      case:
        rules:
          # snake_case, to match the slog attribute keys the tool has always
          # emitted (companions_copied, would_delete, source_hashed). The text and
          # JSON renderings of a run are the same document, so they must name the
          # same things identically.
          json: snake

formatters:
  enable:
    - gofmt
    - goimports
